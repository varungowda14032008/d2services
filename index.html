<style>
:root{--bg:#f1fbfa;--surf:rgba(255,255,255,.72);--ink:#0b2b33;--mut:#48676f;--teal:#0f8b8d;--teal2:#0a6b6d;--acc:#ff8a5b;--line:#cde8e6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06171b;--surf:rgba(14,42,48,.7);--ink:#e6f5f4;--mut:#9bbcc0;--teal:#3fd0cf;--teal2:#7fe3e2;--line:#1b4249;--on:#04262a}}
:root[data-theme="dark"]{--bg:#06171b;--surf:rgba(14,42,48,.7);--ink:#e6f5f4;--mut:#9bbcc0;--teal:#3fd0cf;--teal2:#7fe3e2;--line:#1b4249;--on:#04262a}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 5vw;background:var(--surf);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.brand small{display:block;font:500 .68rem Inter;color:var(--mut)}
nav{display:flex;gap:18px;align-items:center;font-size:.9rem;font-weight:500}
nav a:hover{color:var(--teal)}
.btn{display:inline-block;border:0;cursor:pointer;font:600 .95rem Inter;padding:12px 22px;border-radius:999px;background:var(--teal);color:var(--on);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,139,141,.35)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--teal)}
.btn.cta{background:var(--acc);color:#2a1206}
.lang{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .8rem Inter;cursor:pointer}
section{padding:90px 5vw;max-width:1180px;margin:auto}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;max-width:620px;margin-left:5vw;padding-left:0}
.eyebrow{color:var(--teal2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
h1{font-size:clamp(2.4rem,6vw,4.4rem);margin:12px 0 16px}
.hero p{color:var(--mut);font-size:1.1rem;max-width:480px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.badge{display:inline-flex;gap:8px;align-items:center;margin-top:26px;padding:8px 16px;border-radius:999px;background:var(--surf);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:.9rem}
h2{font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:10px}
.sub{color:var(--mut);max-width:560px;margin:0 0 34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:24px;backdrop-filter:blur(12px);transition:transform .15s ease-out,box-shadow .3s;transform-style:preserve-3d;will-change:transform}
.card:hover{box-shadow:0 20px 40px rgba(11,43,51,.14)}
.card .ic{font-size:2rem;display:inline-block;transform:translateZ(30px);transition:transform .6s}
.card:hover .ic{transform:translateZ(40px) rotateY(360deg)}
.card h3{font-size:1.2rem;margin:10px 0 6px}
.card p{color:var(--mut);font-size:.93rem;margin:0 0 14px}
.card .link{color:var(--teal2);font-weight:600;font-size:.9rem;cursor:pointer;background:none;border:0;padding:0}
.ph{aspect-ratio:4/3;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:.85rem;color:var(--mut);background:linear-gradient(135deg,rgba(15,139,141,.18),rgba(255,138,91,.16));border:1.5px dashed var(--line)}
.about{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:34px;align-items:center}
.about .ph{aspect-ratio:3/4}
.stars{color:var(--acc);letter-spacing:2px}
.quote{font-size:.97rem}
.who{margin-top:12px;color:var(--mut);font-size:.85rem}
form{background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,4vw,34px);backdrop-filter:blur(14px)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 6px}
input,select,textarea{width:100%;font:400 1rem Inter;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:transparent}
.err{color:#d6452f;font-size:.8rem;min-height:1em;margin-top:4px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 .88rem Inter;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--teal);color:var(--on);border-color:var(--teal)}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.done{text-align:center}
.done .tick{width:74px;height:74px;border-radius:50%;background:var(--teal);color:var(--on);display:inline-flex;align-items:center;justify-content:center;font-size:2.2rem;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.sum{text-align:left;max-width:420px;margin:18px auto;padding:16px 20px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:.95rem}
.hidden{display:none}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
footer{padding:34px 5vw 90px;text-align:center;color:var(--mut);font-size:.88rem;border-top:1px solid var(--line);background:var(--surf);backdrop-filter:blur(10px)}
.float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;gap:10px}
.float a{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.float .wa{background:#25d366}.float .ca{background:var(--acc)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
.cf{position:fixed;top:40%;font-size:1.6rem;z-index:50;pointer-events:none;animation:fly 1.6s ease-out forwards}
#fallback{display:none;position:fixed;right:8vw;top:30%;font-size:12rem;z-index:0;opacity:.35}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media(max-width:760px){nav a.n{display:none}.about{grid-template-columns:1fr}.f2{grid-template-columns:1fr}#bg{opacity:.4}.hero{min-height:80vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
.logo{width:38px;height:38px;border-radius:50%}
.hero{align-items:flex-start}
.pic{width:100%;border-radius:18px;display:block;object-fit:cover;cursor:zoom}
